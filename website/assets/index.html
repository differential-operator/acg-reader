<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACG Reader · 作品阅读器</title>
<style>
:root{color-scheme:dark;--bg:#111412;--panel:#1b201d;--muted:#97a69c;--accent:#b9e986}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf2ed;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{border-bottom:1px solid #303b32;padding:20px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px;letter-spacing:3px}header span{color:var(--muted);font-size:12px}main{max-width:1160px;margin:auto;padding:48px 24px}.eyebrow{color:var(--accent);letter-spacing:2px;font-size:12px}h1{font-size:clamp(30px,5vw,48px);line-height:1.3;margin:15px 0}p{color:var(--muted)}form{display:flex;gap:10px;margin:28px 0 12px}input,select,button{font:inherit;border-radius:9px;border:1px solid #39463c;padding:12px;background:var(--panel);color:inherit}input{flex:1;min-width:0}button{cursor:pointer}button.primary{background:var(--accent);color:#172211;font-weight:700;border:0;padding:12px 25px}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:wait}.hint{font-size:12px;color:var(--muted)}#message{color:#efc881;white-space:pre-wrap}.intro{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:50px}.intro div{border-top:1px solid #39463c;padding-top:18px}.intro b{display:block}.intro span{color:var(--muted);font-size:13px}#work{display:none;margin-top:36px}.workhead{padding:24px;background:var(--panel);border:1px solid #303b32;border-radius:12px}h2{font-size:22px;margin:0 0 12px;overflow-wrap:anywhere}.stats{display:flex;gap:20px;color:var(--muted);font-size:13px;flex-wrap:wrap}progress{width:100%;height:5px;accent-color:var(--accent);margin-top:18px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:22px 0}.toolbar select,.toolbar button,.toolbar input{padding:8px 12px}.toolbar input{width:90px;flex:0 1 90px}#media{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.card{background:var(--panel);border:1px solid #303b32;border-radius:9px;overflow:hidden;min-width:0}.card img{display:block;width:100%;height:320px;object-fit:contain;background:#0c0e0d}.card video{width:100%;height:320px}.caption{padding:10px 14px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}a{color:var(--accent)}#media.read{display:block;max-width:900px;margin:auto}#media.read .card{margin:0 0 12px}#media.read img,#media.read video{height:auto;min-height:120px;max-height:none}.embed{padding:35px 20px}.failed{padding:20px;color:#efc881;display:block}.empty{padding:60px 0;color:var(--muted);text-align:center}.pager{display:flex;justify-content:center;align-items:center;gap:16px;margin:30px 0}#errors{font-size:13px;color:#efc881;max-height:160px;overflow:auto}footer{margin-top:50px;color:var(--muted);font-size:12px;border-top:1px solid #303b32;padding-top:20px}@media(max-width:600px){main{padding:25px 16px}.intro{grid-template-columns:1fr}form{flex-direction:column}header span{display:none}}
button.primary:disabled{background:#fff;color:#555;opacity:1;cursor:default}#media .card img{cursor:zoom-in}#preview{width:96vw;height:94vh;max-width:none;max-height:none;padding:0;border:1px solid #465044;border-radius:12px;background:#111412;color:#edf2ed}#preview::backdrop{background:#000c}.previewbar{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid #39463c}.previewbar span{flex:1}.previewbody{height:calc(100% - 66px);overflow:auto;text-align:center;display:flex;align-items:flex-start;justify-content:center;padding:12px}#preview-image{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in;margin:auto}#preview-image.original{max-width:none;max-height:none;cursor:zoom-out;margin:0}.previewbody:has(.original){display:block}#preview-error{color:#efc881}@media(max-width:600px){h1 .hero-action{display:block;white-space:nowrap}}</style>
<header><strong>ACG Reader</strong><a href="https://github.com/differential-operator/acg-reader" target="_blank" rel="noopener noreferrer" aria-label="打开 GitHub 仓库" style="font-size:14px;text-decoration:none;white-space:nowrap">GitHub 仓库 ↗</a></header>
<main><h1>不想一页一页翻？<span class="hero-action">一键提取！</span></h1><p>粘贴作品任意一页的链接，自动整理所有分页中的图片与视频。</p>
<form id="form"><input id="url" type="url" required placeholder="https://www.acgmhaa.com/h/902864-2.html" aria-label="作品网址"><button class="primary" id="start" type="button">提取</button><button id="reset" type="button">重置</button></form><div class="hint">支持 acgmhaa.com 作品链接；自动从第一页开始，按原始顺序整理。</div><div id="message" role="status"></div>
<div class="intro" id="intro"><div><b>01 / 任意一页开始</b><span>自动识别作品编号与分页，归并到同一部作品。</span></div><div><b>02 / 持续整理</b><span>控制并发抓取，保留本地索引，失败页面可重试。</span></div><div><b>03 / 轻松浏览</b><span>网格预览或连续阅读，分批显示与延迟加载。</span></div></div>
<section id="work"><div class="workhead"><h2 id="title"></h2><div class="stats"><span id="status"></span><span id="count"></span><span id="total"></span></div><progress id="progress" value="0" max="1"></progress><div id="errors"></div></div>
<div class="toolbar"><select id="mode" aria-label="阅读模式"><option value="grid">网格预览</option><option value="read">连续阅读</option></select><select id="filter" aria-label="媒体类型"><option value="all">全部媒体</option><option value="image">图片</option><option value="video">视频 / 播放器</option></select><button id="retry">重试失败页</button><button id="export">导出媒体清单</button><span style="flex:1"></span><input id="jump" type="number" min="1" value="1" aria-label="跳转媒体序号"><button id="go">跳转序号</button></div>
<div id="media"></div><div class="pager"><button id="prev">← 上一批</button><span id="range"></span><button id="next">下一批 →</button></div></section>
<footer>任务仅保留在当前浏览器页面 · 每批 40 项，按需加载 · 使用 Chrome / Edge 可选择文件夹保存</footer></main>
<dialog id="preview" aria-label="图片放大预览"><div class="previewbar"><button id="preview-prev" aria-label="上一张">←</button><span id="preview-label"></span><button id="preview-next" aria-label="下一张">→</button><button id="preview-zoom">原始尺寸</button><button id="preview-close">关闭 ×</button></div><div class="previewbody"><img id="preview-image" alt="放大预览" referrerpolicy="no-referrer"><span id="preview-error" hidden>图片加载失败，请关闭后重试。</span></div></dialog>
<link rel="icon" href="/favicon.ico"><script src="/hls.min.js"></script><script src="/mux.min.js"></script><script src="/web-client.js"></script>
<script>
const $=id=>document.getElementById(id);let job=null,offset=0,timer=null,key='',generation=0,starting=false,saving=false,saveController=null,resetting=false,launchRequest=null;const size=40;
async function api(path,data){return webApi(path,data)}
function list(){return (job?.media||[]).filter(m=>$('filter').value==='all'||($('filter').value==='image'?m.kind==='image':m.kind!=='image'))}
function updateButton(){ $('start').textContent=job?.status==='complete'?'保存':'提取';$('start').disabled=resetting||starting||saving||job?.status==='running';$('url').disabled=starting||!!job;}
function render(force=false){updateButton();if(!job)return;$('work').style.display='block';$('intro').style.display='none';$('title').textContent=job.title;$('status').textContent=({running:'正在整理…',complete:'整理完成',partial:'部分页面需要重试'})[job.status];$('count').textContent=job.media.length+' 个媒体';$('total').textContent=job.completed+' / '+job.total+' 页已解析';$('progress').max=job.total;$('progress').value=job.completed;$('retry').disabled=job.status==='running'||!Object.keys(job.errors).length;$('errors').textContent=Object.entries(job.errors).map(([n,e])=>'第 '+n+' 页：'+e).join('\n');
const items=list();offset=Math.min(offset,Math.max(0,Math.ceil(items.length/size)-1)*size);const visible=items.slice(offset,offset+size);const nextKey=JSON.stringify([visible,job.status,offset,$('mode').value]);if(force||key!==nextKey){key=nextKey;$('media').className=$('mode').value;disposeVideos();$('media').replaceChildren();visible.forEach((m,i)=>{const card=document.createElement('article');card.className='card';let el;
if(m.kind==='image'){el=document.createElement('img');el.loading='lazy';el.decoding='async';el.alt='第 '+m.page+' 页';el.src=m.url;el.referrerPolicy='no-referrer';el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','放大预览：第 '+m.page+' 页');el.onclick=()=>openPreview(m.url);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPreview(m.url)}};el.onerror=()=>{const b=document.createElement('button');b.className='failed';b.textContent='图片加载失败，点击重试';b.onclick=()=>{el.src=m.url;el.style.display='block';b.remove()};el.style.display='none';card.prepend(b)}}else if(m.kind==='video'){el=document.createElement('video');el.controls=true;el.preload='none';if(m.format==='hls')attachHls(el,m);else el.src=m.url}else{el=document.createElement('div');el.className='embed';el.textContent='外部播放器 · 请使用原始链接打开'}card.append(el);const cap=document.createElement('div');cap.className='caption';const label=document.createElement('span');label.textContent='#'+(offset+i+1)+' · 原站第 '+m.page+' 页';const a=document.createElement('a');a.href=m.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='打开原链接 ↗';cap.append(label,a);card.append(cap);$('media').append(card)});if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent=job.status==='running'?'正在读取正文，请稍候…':'暂无可显示的媒体，请查看页面错误信息。';$('media').append(e)}}$('range').textContent=items.length?`${offset+1}–${Math.min(offset+size,items.length)} / ${items.length}`:'0 / 0';$('prev').disabled=offset===0;$('next').disabled=offset+size>=items.length}
async function poll(token=generation){
if(token!==generation||!job)return;
const id=job.id;
try{const result=await api('/api/jobs/'+id);if(token!==generation)return;job=result;render();if(job.status==='running')timer=setTimeout(()=>poll(token),1500)}catch(e){if(token!==generation)return;$('message').textContent='连接中断：'+e.message;timer=setTimeout(()=>poll(token),4000)}}
$('start').onclick=()=>{if(job?.status==='complete')saveMedia();else $('form').requestSubmit()};
$('form').onsubmit=async e=>{e.preventDefault();if(resetting||starting||saving||job?.status==='running')return;if(job?.status==='complete')return saveMedia();const token=generation;starting=true;updateButton();$('message').textContent='';clearTimeout(timer);try{launchRequest=api(job?'/api/retry':'/api/jobs',job?{id:job.id}:{url:$('url').value});const result=await launchRequest;if(token!==generation){await api('/api/reset',{id:result.id});return}job=result;offset=0;render(true);if(job.status==='running')timer=setTimeout(()=>poll(token),1000)}catch(e){if(token===generation)$('message').textContent=e.message}finally{if(token===generation){starting=false;updateButton()}}};
$('reset').onclick=async()=>{disposeVideos();if(window.chrome?.webview)window.chrome.webview.postMessage({type:'cancelSave'});nativeSaveToken=null;closePreview();const old=job,pending=starting?launchRequest:null;resetting=true;$('reset').disabled=true;generation++;clearTimeout(timer);saveController?.abort();saveController=null;job=null;starting=false;saving=false;offset=0;key='';$('url').value='';$('media').querySelectorAll('video').forEach(v=>{v.pause();v.removeAttribute('src');v.load()});$('media').replaceChildren();$('work').style.display='none';$('intro').style.display='grid';$('message').textContent='';updateButton();try{if(old)await api('/api/reset',{id:old.id});if(pending){let created;try{created=await pending}catch{}if(created)await api('/api/reset',{id:created.id})}}catch(e){$('message').textContent='界面已清空，但终止后台任务失败：'+e.message}finally{resetting=false;$('reset').disabled=false;updateButton()}};
$('retry').onclick=async()=>{const token=generation;try{const result=await api('/api/retry',{id:job.id});if(token!==generation)return;job=result;render();clearTimeout(timer);poll(token)}catch(e){if(token===generation)$('message').textContent=e.message}};
async function saveMedia(){
if(saving||job?.status!=='complete')return;
if(window.chrome?.webview){saving=true;updateButton();nativeSaveToken=String(generation)+'-'+Date.now();window.chrome.webview.postMessage({type:'save',id:job.id,token:nativeSaveToken});return}
if(!window.showDirectoryPicker){$('message').textContent='请选择 Chrome 或 Edge 打开本应用，以选择文件夹保存素材。';return}
const token=generation, collection=job; saving=true;updateButton();
let controller;
try{
const directory=await window.showDirectoryPicker({mode:'readwrite'});if(token!==generation)return;
controller=new AbortController();saveController=controller;
const name='Acg-'+collection.base.split('/').pop()+'-'+Date.now();const folder=await directory.getDirectoryHandle(name,{create:true});
let completed=0,settled=0,downloaded=0,nextIndex=0;const errors=[];const started=performance.now();
function progress(){if(token!==generation)return;const mb=downloaded/1048576,seconds=Math.max(1,(performance.now()-started)/1000);$('message').textContent=`正在保存：已处理 ${settled} / ${collection.media.length}，已保存 ${completed}，失败 ${errors.length} · 已下载 ${mb.toFixed(1)} MB · ${(mb/seconds).toFixed(2)} MB/s`}
async function write(name,content){const file=await folder.getFileHandle(name,{create:true});const stream=await file.createWritable();try{if(controller.signal.aborted)throw new DOMException('已终止','AbortError');if(content instanceof ReadableStream)await content.pipeTo(stream,{signal:controller.signal});else{await stream.write(content);await stream.close()}}catch(e){try{await stream.abort()}catch{}try{await folder.removeEntry(name)}catch{}throw e}}
// Write the index first, so the destination contains useful information immediately.
await write('媒体清单.json',JSON.stringify({...collection,saveStatus:'saving'},null,2));
const ticker=setInterval(progress,500);
async function worker(){while(nextIndex<collection.media.length){
if(token!==generation||controller.signal.aborted)return;
const i=nextIndex++,m=collection.media[i],prefix=String(i+1).padStart(5,'0');
try{if(m.kind==='embed'){await write(prefix+'-播放器链接.txt',m.url);continue}
const extension=m.format==='hls'?'.mp4':(new URL(m.url).pathname.match(/\.(webp|avif|png|jpe?g|gif|bmp|mp4|webm|mov|m4v|mkv)$/i)?.[0]||(m.kind==='image'?'.img':'.video'));
let lastError;
for(let attempt=0;attempt<2;attempt++){
try{let measured;if(m.format==='hls'){measured=await hlsMp4Stream(m,controller.signal,n=>downloaded+=n)}else{const response=await fetch(mediaProxy(m.url),{signal:controller.signal});if(!response.ok){const detail=await response.json();throw Error(detail.error||'下载失败')}measured=response.body.pipeThrough(new TransformStream({transform(chunk,writer){downloaded+=chunk.byteLength;writer.enqueue(chunk)}}))}
await write(prefix+extension,measured);lastError=null;break;
}catch(e){if(controller.signal.aborted)throw e;lastError=e}}
if(lastError)throw lastError;completed++;
}catch(e){if(controller.signal.aborted||token!==generation)return;errors.push({index:i+1,url:m.url,error:e.message})}finally{settled++;progress()}}}
try{await Promise.all(Array.from({length:Math.min(3,collection.media.length)},worker))}finally{clearInterval(ticker)}
if(token!==generation||controller.signal.aborted)return;
await write('媒体清单.json',JSON.stringify({...collection,saveStatus:errors.length?'partial':'complete',saveErrors:errors},null,2));
$('message').textContent=`已保存 ${completed} 个素材到 ${name}`+(errors.length?`；${errors.length} 项失败，详情见媒体清单，可再次点击保存重试。`:'。');
}catch(e){if(token===generation)$('message').textContent=e.name==='AbortError'?'已取消保存。':'保存失败：'+e.message}
finally{if(token===generation){saving=false;saveController=null;updateButton()}}
}
const hlsPlayers=new Set();
function disposeVideos(){for(const h of hlsPlayers)h.destroy();hlsPlayers.clear();$('media').querySelectorAll('video').forEach(v=>v.pause())}
function attachHls(video,item){const index=job.media.findIndex(m=>m.url===item.url),source=hlsProxy(item.url);
if(window.Hls?.isSupported()){const h=new Hls({autoStartLoad:false,maxBufferLength:30});hlsPlayers.add(h);h.attachMedia(video);h.loadSource(source);video.addEventListener('play',()=>h.startLoad(),{once:true});h.on(Hls.Events.ERROR,(_,data)=>{if(data.fatal){video.title='视频加载失败，可点击打开原链接或重试提取';h.destroy();hlsPlayers.delete(h)}})}else if(video.canPlayType('application/vnd.apple.mpegurl'))video.src=source;else video.title='当前环境不支持 HLS 视频，请更新 WebView2';}
let nativeSaveToken=null;
if(window.chrome?.webview)window.chrome.webview.addEventListener('message',event=>{const m=event.data;if(m.token!==nativeSaveToken)return;if(m.type==='saveProgress'||m.type==='saveFinished')$('message').textContent=m.message;if(m.type==='saveFinished'){saving=false;nativeSaveToken=null;updateButton()}});
let previewUrl='',previewFocus=null;
function previewImages(){return (job?.media||[]).filter(m=>m.kind==='image')}
function openPreview(url){previewUrl=url;const images=previewImages(),index=images.findIndex(m=>m.url===url);if(index<0)return;const image=$('preview-image');image.classList.remove('original');$('preview-zoom').textContent='原始尺寸';$('preview-error').hidden=true;image.hidden=false;image.src=url;$('preview-label').textContent=`${index+1} / ${images.length} · 原站第 ${images[index].page} 页`;$('preview-prev').disabled=index===0;$('preview-next').disabled=index===images.length-1;if(!$('preview').open){previewFocus=document.activeElement;$('preview').showModal()}}
function closePreview(){if($('preview').open)$('preview').close();$('preview-image').removeAttribute('src');previewUrl='';previewFocus?.focus();previewFocus=null}
function stepPreview(delta){const images=previewImages(),index=images.findIndex(m=>m.url===previewUrl);if(images[index+delta])openPreview(images[index+delta].url)}
$('preview-close').onclick=closePreview;$('preview-prev').onclick=()=>stepPreview(-1);$('preview-next').onclick=()=>stepPreview(1);
$('preview-zoom').onclick=()=>{const original=$('preview-image').classList.toggle('original');$('preview-zoom').textContent=original?'适应窗口':'原始尺寸'};
$('preview-image').onclick=()=>$('preview-zoom').click();$('preview-image').onerror=()=>{$('preview-image').hidden=true;$('preview-error').hidden=false};
$('preview').addEventListener('cancel',e=>{e.preventDefault();closePreview()});$('preview').addEventListener('click',e=>{if(e.target===$('preview'))closePreview()});
$('preview').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();stepPreview(-1)}if(e.key==='ArrowRight'){e.preventDefault();stepPreview(1)}});
for(const id of ['filter','mode'])$(id).onchange=()=>{offset=0;render(true)};
function move(delta){offset+=delta;render(true);$('work').scrollIntoView({behavior:'smooth'})}$('prev').onclick=()=>move(-size);$('next').onclick=()=>move(size);$('go').onclick=()=>{offset=Math.floor((Math.max(1,Number($('jump').value)||1)-1)/size)*size;render(true)};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(job,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='collection-'+job.base.split('/').pop()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></html>
